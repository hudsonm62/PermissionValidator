name: 📦 Releaser

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: "Release Type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - alpha

permissions:
  contents: write

concurrency:
  group: releaser
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODRINTH_ID: MgGi86RS

    steps:
      - name: ⚙️ Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Get Mod Version
        id: get-version
        shell: pwsh
        run: |
          $Version = (Get-Content gradle.properties | Select-String '^mod\.version\s*=').ToString().Split('=')[1].Trim()
          echo "version=$Version" >> $env:GITHUB_OUTPUT

      - name: 🔍 Check Tag doesn't exist
        id: get-tag
        shell: pwsh
        run: |
          $Tag = "v${{ steps.get-version.outputs.version }}"

          git fetch --tags
          $tagExists = git tag --list $Tag
          if ($tagExists) {
            throw "❌ Tag '$Tag' already exists. Aborting release."
          }
          Write-Host "✅ Tag '$Tag' does not exist. Proceeding with release."

          # Set output for next step
          echo "version=$Tag" >> $env:GITHUB_OUTPUT

      - name: ⚙️ Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          gradle-version: wrapper
          validate-wrappers: true
          cache-provider: basic

      - name: ⚙️ Make Gradlew and Release Script Executable
        run: chmod +x ./gradlew ./scripts/release.sh

      - name: 📦 Build & Publish to Modrinth
        env:
          DO_PUBLISH: "true"
          MODRINTH_ID: ${{ env.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_TYPE: ${{ inputs.version-type }}
        shell: sh
        run: ./scripts/release.sh "${{ steps.get-version.outputs.version }}"

      - name: 📦 Publish to ziro maven
        uses: ./.github/actions/publish-gh-maven
        with:
          repository: hudsonm62/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          branch: master
          group-id: com.ziroau
          artifact-id: permissionvalidator
          version: ${{ steps.get-version.outputs.version }}

      - name: 🏷️ Create Tag
        shell: pwsh
        run: |
          $Tag = "${{ steps.get-tag.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$Tag" -m "$Tag"
          git push origin "$Tag"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        id: gh-release
        with:
          tag_name: ${{ steps.get-tag.outputs.version }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ github.event.inputs.version-type != 'stable' }}
          files: |
            build/libs/*.jar
