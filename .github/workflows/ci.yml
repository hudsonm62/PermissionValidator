name: 🧪 CI Flow

on:
  workflow_dispatch:
  push:
    paths: # only run on relevant changes
      - ".github/workflows/ci.yml"
      - "src/**"
      - "scripts/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "**/*.gradle.kts"
      - "**/gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⚙️ Checkout code
        uses: actions/checkout@v7

      - name: ⚙️ Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          gradle-version: wrapper
          validate-wrappers: true
          cache-provider: basic

      - name: ⚙️ Make Gradlew Executable
        shell: bash
        run: chmod +x ./gradlew

      - name: 🧪 Run Build
        shell: bash
        run: ./gradlew buildAndCollect --stacktrace

      - name: 🔍 Get Mod Version
        id: get-version
        shell: pwsh
        run: |
          $Version = (Get-Content gradle.properties | Select-String '^mod\.version\s*=').ToString().Split('=')[1].Trim()
          echo "version=$Version" >> $env:GITHUB_OUTPUT

      - name: 🔍 Get Short SHA
        id: short-sha
        uses: hudsonm62/short-sha@v1

      - name: 📦 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-version.outputs.version }}-${{ github.run_id }}.${{ github.run_attempt }}.${{ steps.short-sha.outputs.sha }}
          retention-days: 3
          include-hidden-files: true
          path: |
            build/libs/*.jar
            build/reports/**/*
            versions/*/build/reports/**/*
